name: Portfolio visual review
on:
  pull_request:
    branches: ['Portfolio', 'main']
permissions:
  contents: read
concurrency:
  group: portfolio-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        island: [about, skills, projects, experience, journey, contact, static]
    env:
      CAPTURE_ISLAND: ${{ matrix.island }}
      # `next dev` sert le site à la racine ; le préfixe /Portfolio n'existe que dans
      # l'export GitHub Pages (PAGES=1, voir next.config.ts).
      PREVIEW_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Compile and capture the real WebGL scenes
        run: |
          npm run dev -- --port 3000 > /tmp/portfolio-next.log 2>&1 &
          node scripts/qa/capture.cjs
      # Le même export statique que la publication (deploy-pages.yml).
      - name: Build
        if: always() && matrix.island == 'about'
        run: npm run build
        env:
          PAGES: '1'
          PAGES_BASE_PATH: /Portfolio
      - name: Lint
        if: always() && matrix.island == 'about'
        run: npm run lint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-review-${{ matrix.island }}-${{ github.event.pull_request.head.sha }}
          path: |
            docs/preview/captures
            /tmp/portfolio-next.log
          retention-days: 14
