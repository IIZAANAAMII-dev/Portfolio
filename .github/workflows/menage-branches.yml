name: Ménage des branches (une seule branche)
# Tâche ponctuelle : supprime les anciennes branches déjà contenues dans Portfolio.
# Elle ne se lance que lorsque ce fichier change.
on:
  push:
    branches: [Portfolio]
    paths: ['.github/workflows/menage-branches.yml']
permissions:
  contents: write
jobs:
  menage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Supprimer les anciennes branches déjà contenues dans Portfolio
        run: |
          set -u
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          for branch in main claude/happy-lovelace-foxref codex/archipel-art-direction codex/archipel-navigation-20261114 dev sauvegarde/codex-github-pages; do
            if ! git rev-parse --verify --quiet "origin/$branch" >/dev/null; then
              echo "absente : $branch"
              continue
            fi
            # Sécurité : on ne supprime une branche que si tous ses commits sont dans Portfolio.
            if git merge-base --is-ancestor "origin/$branch" "$GITHUB_SHA"; then
              git push origin --delete "$branch" && echo "supprimée : $branch"
            else
              echo "::warning::conservée (contient des commits absents de Portfolio) : $branch"
            fi
          done
          # Ancienne copie du site compilé : le site publié est sur codex/github-pages.
          if git rev-parse --verify --quiet origin/gh-pages >/dev/null; then
            git push origin --delete gh-pages && echo "supprimée : gh-pages"
          fi
          echo "--- branches restantes"
          git ls-remote --heads origin | awk '{print $2}'
